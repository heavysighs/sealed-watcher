name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate signing keystore if missing
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v -keystore app/release.keystore \
              -alias sealedwatcher -storepass sealedwatcher -keypass sealedwatcher \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sealed Watcher"
          fi
      - name: Unit tests (service-list logic)
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest
      - name: Build release APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-watcher-apk
          path: app/build/outputs/apk/release/app-release.apk
      # The keystore signs every future update of this app. On the FIRST build
      # it is generated on the runner; download this artifact and commit
      # app/release.keystore into the project, or updates will not install
      # over this build.
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-watcher-keystore
          path: app/release.keystore
